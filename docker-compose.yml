services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socketfi_history
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - socketfi_history_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socketfi_history"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  indexer:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:4015:4015"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  socketfi_history_pg:
